name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        working-directory: contracts-evm
        run: forge fmt --check

      - name: Build contracts
        working-directory: contracts-evm
        run: forge build --sizes

      - name: Run contract tests
        working-directory: contracts-evm
        run: forge test -vvv

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    env:
      VITE_CHAIN_ID: "2910"
      VITE_MORPH_RPC_URL: https://rpc-hoodi.morph.network
      VITE_MORPH_EXPLORER: https://explorer-hoodi.morph.network
      VITE_VENDOR_REGISTRY_ADDRESS: "0x0000000000000000000000000000000000000000"
      VITE_PALENGKE_PAYMENT_ADDRESS: "0x0000000000000000000000000000000000000000"
      VITE_UTANG_ESCROW_ADDRESS: "0x0000000000000000000000000000000000000000"
      VITE_DEPLOY_BLOCK: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
