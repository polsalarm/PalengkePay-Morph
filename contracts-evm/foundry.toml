[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
morph_hoodi = "${MORPH_HOODI_RPC}"
morph = "${MORPH_RPC}"

# Morph uses a Blockscout-style verifier. `forge verify-contract --verifier blockscout`
# with this URL, or set the key if the explorer requires one.
[etherscan]
morph_hoodi = {key = "${MORPH_EXPLORER_API_KEY}", url = "https://explorer-hoodi.morph.network/api", chain = 2910}
